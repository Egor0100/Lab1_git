server {
    listen 80;

    # Статика фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Всё, что начинается с /api/, nginx проксирует в контейнер бэкенда.
    # "backend" — имя сервиса из compose.yaml, Docker DNS превращает его в IP.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
