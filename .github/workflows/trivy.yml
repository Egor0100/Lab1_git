name: Trivy scan

on:
  push:
  pull_request:
  workflow_dispatch:   # ручной запуск из вкладки Actions

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [lab-backend, lab-frontend]

    steps:
      - uses: actions/checkout@v4

      # Собираем ровно те образы, которые использует compose.yaml
      - name: Build images with Docker Compose
        run: docker compose build

      # Версии закреплены намеренно: в марте 2026 теги trivy-action 0.0.1–0.34.2
      # и бинарник Trivy v0.69.4 были скомпрометированы (GHSA-69fq-xp46-6x23).
      - name: Trivy scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: ${{ matrix.image }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # уязвимости показываются в логе, но не валят сборку
