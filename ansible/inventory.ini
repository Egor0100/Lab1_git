# VM доступна через проброс порта QEMU: 127.0.0.1:2222 -> VM:22
[lab]
lab-vm ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[lab:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
# Локальная лабораторная VM: при пересоздании меняется host key, поэтому не проверяем его
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
